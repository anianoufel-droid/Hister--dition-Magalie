<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitster · Édition Magalie 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <header>
      <h1>Hitster</h1>
      <p class="subtitle">Édition Magalie <span class="heart">💗</span></p>
    </header>

    <!-- CONNEXION -->
    <section id="loginSection" class="card">
      <div class="vinyl small"><div class="label"></div></div>
      <button id="loginButton" class="primary-button">Se connecter à Spotify</button>
      <p class="small-text">Connecte le compte Spotify qui fera jouer les chansons.</p>
    </section>

    <!-- APPLICATION -->
    <section id="app" class="hidden">

      <div class="status">
        <span id="statusDot" class="status-dot">●</span>
        <span id="statusText">Connexion à Spotify...</span>
      </div>

      <div class="card player">
        <div id="albumPlaceholder" class="vinyl"><div class="label"></div></div>
        <img id="albumImage" class="album-image hidden" alt="">

        <h2 id="songTitle">Prête à jouer ?</h2>
        <p id="artistName">Scanne une carte pour lancer une chanson mystère ✨</p>

        <button id="playButton" class="primary-button">⏯ Lecture / Pause</button>
      </div>

      <button id="testButton" class="secondary-button">🎲 Tester une carte</button>

      <p class="tip">💻 Garde cette page ouverte sur l'ordinateur<br>📱 puis scanne les cartes avec ton cellulaire</p>

    </section>

  </main>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="app.js"></script>

</body>
</html>
